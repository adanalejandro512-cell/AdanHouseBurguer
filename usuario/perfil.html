<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mi Perfil</title>

    <link rel="stylesheet" href="perfil.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>

<body>

    <!-- HEADER -->

    <header>

        <h1>👤 MI PERFIL</h1>

        <p>
            Administra tu información personal
            y configuración de cuenta.
        </p>

    </header>

    <!-- CONTENEDOR PRINCIPAL -->

    <main>

        <!-- TARJETA PERFIL -->

        <section class="perfil-card">

            <div class="perfil-img">

                <img src="https://images.pexels.com/photos/220453/pexels-photo-220453.jpeg" alt="Usuario">

            </div>

            <div class="perfil-info">

                <h2>Adán Ramos</h2>

                <p>

                    <i class="fa-solid fa-envelope"></i>

                    adanramos@gmail.com

                </p>

                <p>

                    <i class="fa-solid fa-phone"></i>

                    +52 55 1234 5678

                </p>

                <p>

                    <i class="fa-solid fa-location-dot"></i>

                    Ciudad de México

                </p>

            </div>

        </section>

        <!-- FORMULARIO -->

        <section class="configuracion">

            <h2>

                <i class="fa-solid fa-gear"></i>

                Configuración de Cuenta

            </h2>

            <form>

                <label>

                    Nombre Completo

                    <input type="text" value="Adán Ramos">

                </label>

                <label>

                    Correo Electrónico

                    <input type="email" value="adanramos@gmail.com">

                </label>

                <label>

                    Número Telefónico

                    <input type="text" value="+52 55 1234 5678">

                </label>

                <label>

                    Dirección

                    <input type="text" value="Ciudad de México">

                </label>

                <label>

                    Contraseña

                    <input type="password" value="123456">

                </label>

                <!-- BOTONES -->

                <div class="botones">

                    <button type="submit">

                        <i class="fa-solid fa-floppy-disk"></i>

                        Guardar Cambios

                    </button>

                    <button type="reset" class="cancelar">

                        <i class="fa-solid fa-xmark"></i>

                        Cancelar

                    </button>

                </div>

            </form>

        </section>

    </main>

    <!-- FOOTER -->

    <footer>

        <a href="usuario.html">

            ← Volver

        </a>

    </footer>

</body>

</html>
