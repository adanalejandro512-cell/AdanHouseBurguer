<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Personalizar Hamburguesa</title>

    <link rel="stylesheet" href="personalizar.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>

<body>

    <!-- HEADER -->

    <header>

        <h1>⚙ PERSONALIZA TU HAMBURGUESA</h1>

        <p>
            Agrega ingredientes extras
            y crea tu hamburguesa perfecta.
        </p>

    </header>

    <!-- CONTENIDO -->

    <main>

        <!-- IMAGEN -->

        <section class="imagen">

            <img src="https://images.pexels.com/photos/1639557/pexels-photo-1639557.jpeg" alt="Hamburguesa">

        </section>

        <!-- OPCIONES -->

        <section class="opciones">

            <h2>🍔 Ingredientes</h2>

            <form>

                <label>
                    <input type="checkbox">
                    Queso Extra
                </label>

                <label>
                    <input type="checkbox">
                    Tocino
                </label>

                <label>
                    <input type="checkbox">
                    Jalapeños
                </label>

                <label>
                    <input type="checkbox">
                    Cebolla Caramelizada
                </label>

                <label>
                    <input type="checkbox">
                    Salsa BBQ
                </label>

                <label>
                    <input type="checkbox">
                    Pepinillos
                </label>

                <label>
                    <input type="checkbox">
                    Doble Carne
                </label>

                <label>
                    <input type="checkbox">
                    Papas Extra
                </label>

                <!-- TAMAÑO -->

                <h2>📏 Tamaño</h2>

                <select>

                    <option>Individual</option>

                    <option>Mediana</option>

                    <option>Grande</option>

                </select>

                <!-- BOTONES -->

                <div class="botones">

                    <button type="submit">

                        <i class="fa-solid fa-cart-shopping"></i>

                        Agregar Pedido

                    </button>

                    <a href="usuario.html">

                        ← Volver

                    </a>

                </div>

            </form>

        </section>

    </main>

</body>

</html>
