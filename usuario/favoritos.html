<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Favoritos Burger House</title>

    <link rel="stylesheet" href="favoritos.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>

<body>

    <!-- HEADER -->

    <header>

        <h1>❤ MIS FAVORITOS</h1>

        <p>
            Tus hamburguesas y productos
            favoritos guardados.
        </p>

    </header>

    <!-- CONTENEDOR -->

    <main>

        <!-- FAVORITO 1 -->

        <section class="favorito">

            <div class="favorito-img">

                <img src="https://images.pexels.com/photos/1639557/pexels-photo-1639557.jpeg" alt="Hamburguesa">

            </div>

            <div class="favorito-info">

                <h2>🍔 Mega Burger</h2>

                <p>
                    Hamburguesa doble carne,
                    queso cheddar y tocino.
                </p>

                <h3>$199</h3>

                <div class="botones">

                    <button class="ordenar">

                        <i class="fa-solid fa-cart-shopping"></i>

                        Ordenar

                    </button>

                    <button class="eliminar">

                        <i class="fa-solid fa-trash"></i>

                        Eliminar

                    </button>

                </div>

            </div>

        </section>

        <!-- FAVORITO 2 -->

        <section class="favorito">

            <div class="favorito-img">

                <img src="https://images.pexels.com/photos/2983101/pexels-photo-2983101.jpeg" alt="Hamburguesa">

            </div>

            <div class="favorito-info">

                <h2>🍟 Classic Burger</h2>

                <p>
                    Carne 100% res,
                    queso y papas.
                </p>

                <h3>$120</h3>

                <div class="botones">

                    <button class="ordenar">

                        <i class="fa-solid fa-cart-shopping"></i>

                        Ordenar

                    </button>

                    <button class="eliminar">

                        <i class="fa-solid fa-trash"></i>

                        Eliminar

                    </button>

                </div>

            </div>

        </section>

        <!-- FAVORITO 3 -->

        <section class="favorito">

            <div class="favorito-img">

                <img src="https://images.unsplash.com/photo-1563805042-7684c019e1cb?q=80&w=1000&auto=format&fit=crop"
                    width="300">

            </div>

            <div class="favorito-info">

                <h2>🥤 Malteada Especial</h2>

                <p>
                    Chocolate,
                    vainilla o fresa.
                </p>

                <h3>$65</h3>

                <div class="botones">

                    <button class="ordenar">

                        <i class="fa-solid fa-cart-shopping"></i>

                        Ordenar

                    </button>

                    <button class="eliminar">

                        <i class="fa-solid fa-trash"></i>

                        Eliminar

                    </button>

                </div>

            </div>

        </section>

    </main>

    <!-- FOOTER -->

    <footer>

        <a href="usuario.html">

            ← Volver

        </a>

    </footer>

</body>

</html>
