<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ofertas Burger House</title>

    <link rel="stylesheet" href="ofertas.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>

<body>

    <!-- HEADER -->

    <header>

        <h1>🏷 OFERTAS ESPECIALES</h1>

        <p>
            Aprovecha nuestras promociones
            y descuentos del día.
        </p>

    </header>

    <!-- CONTENEDOR -->

    <main>

        <!-- OFERTA 1 -->

        <section class="oferta">

            <div class="oferta-img">


                <img src="https://images.pexels.com/photos/2983101/pexels-photo-2983101.jpeg" alt="Hamburguesa">
            </div>

            <div class="oferta-info">

                <h2>🍔 Combo Mega Burger</h2>

                <p>
                    Hamburguesa doble carne,
                    papas grandes y refresco.
                </p>

                <div class="precios">

                    <span class="antes">
                        $250
                    </span>

                    <span class="ahora">
                        $199
                    </span>

                </div>

                <button>

                    <i class="fa-solid fa-fire"></i>

                    Aprovechar Oferta

                </button>

            </div>

        </section>

        <!-- OFERTA 2 -->

        <section class="oferta">

            <div class="oferta-img">

                <img src="https://images.pexels.com/photos/1639557/pexels-photo-1639557.jpeg" alt="Hamburguesa">

            </div>

            <div class="oferta-info">

                <h2>🍟 Classic Burger</h2>

                <p>
                    Hamburguesa clásica
                    con queso cheddar.
                </p>

                <div class="precios">

                    <span class="antes">
                        $150
                    </span>

                    <span class="ahora">
                        $120
                    </span>

                </div>

                <button>

                    <i class="fa-solid fa-fire"></i>

                    Aprovechar Oferta

                </button>

            </div>

        </section>

        <!-- OFERTA 3 -->

        <section class="oferta">

            <div class="oferta-img">

                <img src="https://images.unsplash.com/photo-1563805042-7684c019e1cb?q=80&w=1000&auto=format&fit=crop"
                    width="300">


            </div>

            <div class="oferta-info">

                <h2>🥤 Malteada Especial</h2>

                <p>
                    Chocolate, vainilla
                    o fresa.
                </p>

                <div class="precios">

                    <span class="antes">
                        $90
                    </span>

                    <span class="ahora">
                        $65
                    </span>

                </div>

                <button>

                    <i class="fa-solid fa-fire"></i>

                    Aprovechar Oferta

                </button>

            </div>

        </section>

    </main>

    <!-- FOOTER -->

    <footer>

        <a href="usuario.html">

            ← Volver

        </a>

    </footer>

</body>

</html>
