<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mapa de Entregas</title>

    <link rel="stylesheet" href="mapa.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>

<body>

    <!-- HEADER -->

    <header>

        <h1>

            <i class="fa-solid fa-map-location-dot"></i>

            MAPA DE ENTREGAS

        </h1>

        <p>
            Visualiza las rutas activas
            y ubicaciones de entrega.
        </p>

    </header>

    <!-- CONTENEDOR PRINCIPAL -->

    <main>

        <!-- MAPA -->

        <section class="mapa-card">

            <div class="mapa-img">

                <img src="map.png" alt="Mapa de entregas">

            </div>

            <!-- INFORMACIÓN -->

            <div class="info">

                <h2>

                    <i class="fa-solid fa-truck-fast"></i>

                    Estado de Distribución

                </h2>

                <div class="ruta">

                    <span>
                        Ruta Activa:
                    </span>

                    <p>
                        Centro → Norte → Universidad
                    </p>

                </div>

                <div class="ruta">

                    <span>
                        Pedidos en Ruta:
                    </span>

                    <p>
                        12 pedidos activos
                    </p>

                </div>

                <div class="ruta">

                    <span>
                        Repartidores Activos:
                    </span>

                    <p>
                        5 disponibles
                    </p>

                </div>

                <div class="ruta">

                    <span>
                        Tiempo Promedio:
                    </span>

                    <p>
                        18 minutos
                    </p>

                </div>

                <button>

                    <i class="fa-solid fa-location-crosshairs"></i>

                    Actualizar Ubicaciones

                </button>

            </div>

        </section>

    </main>

    <!-- BOTÓN REGRESAR -->

    <section class="acciones">

        <a href="distribucion.html">

            ← Regresar

        </a>

    </section>

</body>

</html>
