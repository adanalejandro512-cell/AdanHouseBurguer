<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Soporte Técnico</title>

    <link rel="stylesheet" href="soporte.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>

<body>

    <!-- HEADER -->

    <header>

        <h1>

            <i class="fa-solid fa-headset"></i>

            SOPORTE TÉCNICO

        </h1>

        <p>
            Reporta problemas relacionados
            con pedidos, rutas o entregas.
        </p>

    </header>

    <!-- CONTENEDOR PRINCIPAL -->

    <main>

        <section class="soporte-card">

            <!-- IMAGEN -->

            <div class="imagen">

                <img src="https://images.pexels.com/photos/7709298/pexels-photo-7709298.jpeg" alt="Soporte Técnico">

            </div>

            <!-- FORMULARIO -->

            <div class="formulario">

                <h2>

                    <i class="fa-solid fa-circle-info"></i>

                    Reportar Incidencia

                </h2>

                <label>

                    Tipo de problema

                </label>

                <select>

                    <option>
                        Pedido retrasado
                    </option>

                    <option>
                        Problema con ruta
                    </option>

                    <option>
                        Pedido cancelado
                    </option>

                    <option>
                        Error en aplicación
                    </option>

                    <option>
                        Otro
                    </option>

                </select>

                <label>

                    Describe el problema

                </label>

                <textarea placeholder="Escribe aquí el problema detectado..."></textarea>

                <button>

                    <i class="fa-solid fa-paper-plane"></i>

                    Enviar Reporte

                </button>

            </div>

        </section>

    </main>

    <!-- BOTÓN REGRESAR -->

    <section class="acciones">

        <a href="distribucion.html">

            ← Regresar

        </a>

    </section>

</body>

</html>
