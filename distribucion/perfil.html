<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Perfil del Repartidor</title>

    <link rel="stylesheet" href="perfil.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>

<body>

    <!-- HEADER -->

    <header>

        <h1>

            <i class="fa-solid fa-motorcycle"></i>

            PERFIL DEL REPARTIDOR

        </h1>

        <p>
            Información general del usuario
            del área de distribución.
        </p>

    </header>

    <!-- CONTENEDOR PRINCIPAL -->

    <main>

        <section class="perfil-card">

            <!-- FOTO -->

            <div class="foto">

                <img src="https://images.pexels.com/photos/220453/pexels-photo-220453.jpeg" alt="Repartidor">

            </div>

            <!-- INFORMACIÓN -->

            <div class="info">

                <h2>

                    <i class="fa-solid fa-user"></i>

                    Datos del Repartidor

                </h2>

                <div class="dato">

                    <span>Nombre:</span>

                    <p>Juan López</p>

                </div>

                <div class="dato">

                    <span>Correo:</span>

                    <p>juanlopez@gmail.com</p>

                </div>

                <div class="dato">

                    <span>Teléfono:</span>

                    <p>951-123-4567</p>

                </div>

                <div class="dato">

                    <span>Estado:</span>

                    <p class="activo">

                        <i class="fa-solid fa-circle"></i>

                        Activo

                    </p>

                </div>

                <div class="dato">

                    <span>Zona:</span>

                    <p>Centro - Norte</p>

                </div>

                <div class="dato">

                    <span>Pedidos Entregados:</span>

                    <p>248</p>

                </div>

            </div>

        </section>

    </main>

    <!-- BOTONES -->

    <section class="acciones">

        <button>

            <i class="fa-solid fa-pen"></i>

            Editar Perfil

        </button>

        <a href="distribucion.html">

            ← Regresar

        </a>

    </section>

</body>

</html>
